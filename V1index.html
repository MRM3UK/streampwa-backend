<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtream Codes Playlist Extractor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #6c63ff;
            --accent-hover: #5a52d5;
            --success: #00d4aa;
            --danger: #ff6b6b;
            --warning: #feca57;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }

        .header h1 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-group input::placeholder {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Button Styles */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--accent);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(108, 99, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: var(--success);
        }

        .btn-success:hover {
            background: #00b894;
            box-shadow: 0 5px 20px rgba(0, 212, 170, 0.4);
        }

        .btn-warning {
            background: var(--warning);
            color: #333;
        }

        .btn-warning:hover {
            background: #feb62c;
            box-shadow: 0 5px 20px rgba(254, 202, 87, 0.4);
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: #ee5a52;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4);
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Controls */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
        }

        .controls input[type="search"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
        }

        .controls select {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .view-toggle {
            display: flex;
            gap: 5px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 12px;
        }

        .view-toggle button {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-toggle button.active {
            background: var(--accent);
            color: white;
        }

        /* Channel List */
        .channel-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .channel-list.grid-view {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        }

        .channel-list.list-view {
            grid-template-columns: 1fr;
        }

        .channel-item {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .channel-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .channel-logo {
            width: 100%;
            height: 120px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
        }

        .list-view .channel-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .list-view .channel-logo {
            width: 80px;
            height: 60px;
            margin-bottom: 0;
        }

        .channel-info {
            flex: 1;
        }

        .channel-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .channel-category {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .channel-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .channel-actions button {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-play {
            background: var(--success);
            color: white;
            flex: 1;
        }

        .action-edit {
            background: var(--warning);
            color: #333;
        }

        .action-delete {
            background: var(--danger);
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-close {
            background: var(--danger);
            border: none;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
        }

        /* Video Player */
        .video-player {
            width: 100%;
            max-width: 100%;
            background: black;
            border-radius: 12px;
            overflow: hidden;
        }

        .video-player video,
        .video-player iframe {
            width: 100%;
            height: auto;
            min-height: 300px;
            display: block;
        }

        /* Settings */
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--glass-border);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: 0.4s;
            border-radius: 26px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--accent);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 2000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
        }

        .toast.warning {
            border-left: 4px solid var(--warning);
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .btn-group {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .controls input[type="search"],
            .controls select {
                width: 100%;
            }

            .modal-content {
                padding: 20px;
            }

            .channel-list.grid-view {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        /* Hide scrollbar but keep functionality */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }

        /* Category Badge */
        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            background: var(--accent);
            color: white;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 10px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎬 Xtream Codes Playlist Extractor</h1>
            <p>Extract, manage, and export your IPTV playlists</p>
        </div>

        <!-- Login Form -->
        <div class="glass-card" id="loginCard">
            <h2 style="margin-bottom: 20px;">Connection Details</h2>
            <div class="form-group">
                <label for="serverUrl">Server URL</label>
                <input type="text" id="serverUrl" placeholder="http://domain.com" />
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" />
            </div>
            <div class="btn-group">
                <button class="btn" onclick="fetchContent('live')">
                    <span>📡 Live Channels</span>
                </button>
                <button class="btn" onclick="fetchContent('vod')">
                    <span>🎬 Movies (VOD)</span>
                </button>
                <button class="btn" onclick="fetchContent('series')">
                    <span>📺 Series</span>
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats" id="statsContainer" style="display: none;">
            <div class="stat-card">
                <div class="stat-number" id="totalChannels">0</div>
                <div class="stat-label">Total Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCategories">0</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="filteredChannels">0</div>
                <div class="stat-label">Filtered</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="glass-card" id="controlsCard" style="display: none;">
            <div class="controls">
                <input type="search" id="searchInput" placeholder="🔍 Search channels..." />
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
                <div class="view-toggle">
                    <button class="active" onclick="setView('grid')">⊞ Grid</button>
                    <button onclick="setView('list')">☰ List</button>
                </div>
            </div>
            <div class="btn-group" style="margin-top: 15px;">
                <button class="btn btn-success" onclick="exportM3U()">
                    💾 Export M3U
                </button>
                <button class="btn btn-warning" onclick="downloadPlaylist()">
                    ⬇️ Download
                </button>
                <button class="btn" onclick="openSettings()">
                    ⚙️ Settings
                </button>
                <button class="btn btn-danger" onclick="clearData()">
                    🗑️ Clear Data
                </button>
            </div>
        </div>

        <!-- Channel List -->
        <div class="glass-card" id="channelListCard" style="display: none;">
            <div class="channel-list grid-view" id="channelList"></div>
        </div>

        <!-- Edit Modal -->
        <div class="modal" id="editModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Edit Channel</h2>
                    <button class="modal-close" onclick="closeModal('editModal')">×</button>
                </div>
                <div class="form-group">
                    <label>Channel Name</label>
                    <input type="text" id="editName" />
                </div>
                <div class="form-group">
                    <label>Group Title</label>
                    <input type="text" id="editGroup" />
                </div>
                <div class="form-group">
                    <label>Logo URL</label>
                    <input type="text" id="editLogo" />
                </div>
                <div class="btn-group">
                    <button class="btn btn-success" onclick="saveEdit()">Save</button>
                    <button class="btn btn-danger" onclick="closeModal('editModal')">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Player Modal -->
        <div class="modal" id="playerModal">
            <div class="modal-content" style="max-width: 900px;">
                <div class="modal-header">
                    <h2 id="playerTitle">Channel Player</h2>
                    <button class="modal-close" onclick="closeModal('playerModal')">×</button>
                </div>
                <div class="video-player" id="videoPlayer"></div>
                <div class="btn-group" style="margin-top: 15px;">
                    <button class="btn" onclick="openInExternalPlayer()">
                        📱 Open in External Player
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div class="modal" id="settingsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button class="modal-close" onclick="closeModal('settingsModal')">×</button>
                </div>
                <div class="setting-item">
                    <span>Use Iframe Player</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="useIframe" onchange="saveSettings()" />
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <span>Use M3U8 Format</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="useM3U8" onchange="saveSettings()" />
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="setting-item">
                    <span>Remember Credentials</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="rememberCreds" checked onchange="saveSettings()" />
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // Global State
        let currentChannels = [];
        let filteredChannels = [];
        let currentType = 'live';
        let currentEditIndex = null;
        let currentPlayUrl = '';
        let settings = {
            useIframe: false,
            useM3U8: false,
            rememberCreds: true
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            loadCredentials();
            loadPlaylist();
            
            // Event listeners
            document.getElementById('searchInput').addEventListener('input', filterChannels);
            document.getElementById('categoryFilter').addEventListener('change', filterChannels);
        });

        // Load saved settings
        function loadSettings() {
            const saved = localStorage.getItem('xtream_settings');
            if (saved) {
                settings = JSON.parse(saved);
                document.getElementById('useIframe').checked = settings.useIframe;
                document.getElementById('useM3U8').checked = settings.useM3U8;
                document.getElementById('rememberCreds').checked = settings.rememberCreds;
            }
        }

        // Save settings
        function saveSettings() {
            settings.useIframe = document.getElementById('useIframe').checked;
            settings.useM3U8 = document.getElementById('useM3U8').checked;
            settings.rememberCreds = document.getElementById('rememberCreds').checked;
            localStorage.setItem('xtream_settings', JSON.stringify(settings));
            showToast('Settings saved', 'success');
        }

        // Load credentials
        function loadCredentials() {
            if (settings.rememberCreds) {
                const creds = localStorage.getItem('xtream_creds');
                if (creds) {
                    const { server, username, password } = JSON.parse(creds);
                    document.getElementById('serverUrl').value = server;
                    document.getElementById('username').value = username;
                    document.getElementById('password').value = password;
                }
            }
        }

        // Save credentials
        function saveCredentials(server, username, password) {
            if (settings.rememberCreds) {
                localStorage.setItem('xtream_creds', JSON.stringify({ server, username, password }));
            }
        }

        // Load playlist from localStorage
        function loadPlaylist() {
            const saved = localStorage.getItem('xtream_playlist');
            if (saved) {
                const data = JSON.parse(saved);
                currentChannels = data.channels || [];
                currentType = data.type || 'live';
                if (currentChannels.length > 0) {
                    displayChannels();
                }
            }
        }

        // Save playlist to localStorage
        function savePlaylist() {
            localStorage.setItem('xtream_playlist', JSON.stringify({
                channels: currentChannels,
                type: currentType
            }));
        }

        // Fetch content from API
        async function fetchContent(type) {
            const server = document.getElementById('serverUrl').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!server || !username || !password) {
                showToast('Please fill all fields', 'error');
                return;
            }

            const btn = event.target.closest('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = originalText + '<span class="spinner"></span>';

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ server, username, password, type })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch data');
                }

                currentChannels = data.streams || [];
                currentType = type;
                
                saveCredentials(server, username, password);
                savePlaylist();
                displayChannels();
                showToast(`Loaded ${currentChannels.length} ${type} items`, 'success');

            } catch (error) {
                console.error('Error:', error);
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        // Display channels
        function displayChannels() {
            filteredChannels = [...currentChannels];
            renderChannels();
            updateStats();
            populateCategories();
            
            document.getElementById('statsContainer').style.display = 'grid';
            document.getElementById('controlsCard').style.display = 'block';
            document.getElementById('channelListCard').style.display = 'block';
        }

        // Render channels to DOM
        function renderChannels() {
            const container = document.getElementById('channelList');
            
            if (filteredChannels.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                        </svg>
                        <h3>No channels found</h3>
                        <p>Try adjusting your filters or fetch new content</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredChannels.map((channel, index) => `
                <div class="channel-item">
                    ${channel.stream_icon ? `<img class="channel-logo" src="${channel.stream_icon}" alt="${channel.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📺%3C/text%3E%3C/svg%3E'" />` : ''}
                    <div class="channel-info">
                        ${channel.category_name ? `<span class="category-badge">${channel.category_name}</span>` : ''}
                        <div class="channel-name">${channel.name}</div>
                        <div class="channel-category">${channel.category_name || 'Uncategorized'}</div>
                    </div>
                    <div class="channel-actions">
                        <button class="action-play" onclick="playChannel(${index})">▶ Play</button>
                        <button class="action-edit" onclick="editChannel(${index})">✎</button>
                        <button class="action-delete" onclick="deleteChannel(${index})">×</button>
                    </div>
                </div>
            `).join('');
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalChannels').textContent = currentChannels.length;
            document.getElementById('filteredChannels').textContent = filteredChannels.length;
            
            const categories = new Set(currentChannels.map(c => c.category_name).filter(Boolean));
            document.getElementById('totalCategories').textContent = categories.size;
        }

        // Populate category filter
        function populateCategories() {
            const select = document.getElementById('categoryFilter');
            const categories = [...new Set(currentChannels.map(c => c.category_name).filter(Boolean))].sort();
            
            select.innerHTML = '<option value="">All Categories</option>' +
                categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        // Filter channels
        function filterChannels() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            filteredChannels = currentChannels.filter(channel => {
                const matchesSearch = channel.name.toLowerCase().includes(searchTerm);
                const matchesCategory = !category || channel.category_name === category;
                return matchesSearch && matchesCategory;
            });

            renderChannels();
            document.getElementById('filteredChannels').textContent = filteredChannels.length;
        }

        // Set view mode
        function setView(mode) {
            const list = document.getElementById('channelList');
            const buttons = document.querySelectorAll('.view-toggle button');
            
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            list.className = `channel-list ${mode}-view`;
        }

        // Play channel
        function playChannel(index) {
            const channel = filteredChannels[index];
            const server = document.getElementById('serverUrl').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            let streamUrl = '';
            const extension = settings.useM3U8 ? '.m3u8' : (currentType === 'live' ? '.ts' : '.mp4');

            if (currentType === 'live') {
                streamUrl = `${server}/live/${username}/${password}/${channel.stream_id}${extension}`;
            } else if (currentType === 'vod') {
                streamUrl = `${server}/movie/${username}/${password}/${channel.stream_id}${extension}`;
            } else if (currentType === 'series') {
                streamUrl = `${server}/series/${username}/${password}/${channel.stream_id}${extension}`;
            }

            currentPlayUrl = streamUrl;
            document.getElementById('playerTitle').textContent = channel.name;
            
            const playerContainer = document.getElementById('videoPlayer');
            
            if (settings.useIframe) {
                playerContainer.innerHTML = `<iframe src="${streamUrl}" frameborder="0" allowfullscreen></iframe>`;
            } else {
                const videoId = 'videoElement';
                playerContainer.innerHTML = `<video id="${videoId}" controls autoplay></video>`;
                
                const video = document.getElementById(videoId);
                
                if (extension === '.m3u8' && Hls.isSupported()) {
                    const hls = new Hls();
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                } else {
                    video.src = streamUrl;
                }
            }
            
            openModal('playerModal');
        }

        // Open in external player (Android intent)
        function openInExternalPlayer() {
            if (currentPlayUrl) {
                const intent = `intent:${currentPlayUrl}#Intent;type=video/*;scheme=http;end`;
                window.location.href = intent;
            }
        }

        // Edit channel
        function editChannel(index) {
            currentEditIndex = index;
            const channel = filteredChannels[index];
            
            document.getElementById('editName').value = channel.name;
            document.getElementById('editGroup').value = channel.category_name || '';
            document.getElementById('editLogo').value = channel.stream_icon || '';
            
            openModal('editModal');
        }

        // Save edit
        function saveEdit() {
            if (currentEditIndex === null) return;
            
            const channel = filteredChannels[currentEditIndex];
            channel.name = document.getElementById('editName').value;
            channel.category_name = document.getElementById('editGroup').value;
            channel.stream_icon = document.getElementById('editLogo').value;
            
            // Update in main array
            const mainIndex = currentChannels.findIndex(c => c.stream_id === channel.stream_id);
            if (mainIndex !== -1) {
                currentChannels[mainIndex] = channel;
            }
            
            savePlaylist();
            renderChannels();
            closeModal('editModal');
            showToast('Channel updated', 'success');
        }

        // Delete channel
        function deleteChannel(index) {
            if (confirm('Are you sure you want to delete this channel?')) {
                const channel = filteredChannels[index];
                currentChannels = currentChannels.filter(c => c.stream_id !== channel.stream_id);
                savePlaylist();
                filterChannels();
                updateStats();
                showToast('Channel deleted', 'success');
            }
        }

        // Export M3U
        function exportM3U() {
            if (currentChannels.length === 0) {
                showToast('No channels to export', 'warning');
                return;
            }

            const server = document.getElementById('serverUrl').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const extension = settings.useM3U8 ? '.m3u8' : (currentType === 'live' ? '.ts' : '.mp4');

            let m3u = '#EXTM3U\n';

            currentChannels.forEach(channel => {
                let streamUrl = '';
                
                if (currentType === 'live') {
                    streamUrl = `${server}/live/${username}/${password}/${channel.stream_id}${extension}`;
                } else if (currentType === 'vod') {
                    streamUrl = `${server}/movie/${username}/${password}/${channel.stream_id}${extension}`;
                } else if (currentType === 'series') {
                    streamUrl = `${server}/series/${username}/${password}/${channel.stream_id}${extension}`;
                }

                m3u += `#EXTINF:-1 tvg-logo="${channel.stream_icon || ''}" group-title="${channel.category_name || 'Uncategorized'}",${channel.name}\n`;
                m3u += `${streamUrl}\n`;
            });

            // Copy to clipboard
            navigator.clipboard.writeText(m3u).then(() => {
                showToast('M3U playlist copied to clipboard!', 'success');
            }).catch(() => {
                showToast('Failed to copy to clipboard', 'error');
            });
        }

        // Download playlist
        function downloadPlaylist() {
            if (currentChannels.length === 0) {
                showToast('No channels to download', 'warning');
                return;
            }

            const server = document.getElementById('serverUrl').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const extension = settings.useM3U8 ? '.m3u8' : (currentType === 'live' ? '.ts' : '.mp4');

            let m3u = '#EXTM3U\n';

            currentChannels.forEach(channel => {
                let streamUrl = '';
                
                if (currentType === 'live') {
                    streamUrl = `${server}/live/${username}/${password}/${channel.stream_id}${extension}`;
                } else if (currentType === 'vod') {
                    streamUrl = `${server}/movie/${username}/${password}/${channel.stream_id}${extension}`;
                } else if (currentType === 'series') {
                    streamUrl = `${server}/series/${username}/${password}/${channel.stream_id}${extension}`;
                }

                m3u += `#EXTINF:-1 tvg-logo="${channel.stream_icon || ''}" group-title="${channel.category_name || 'Uncategorized'}",${channel.name}\n`;
                m3u += `${streamUrl}\n`;
            });

            const blob = new Blob([m3u], { type: 'audio/x-mpegurl' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `xtream_${currentType}_${Date.now()}.m3u`;
            a.click();
            URL.revokeObjectURL(url);
            
            showToast('Playlist downloaded!', 'success');
        }

        // Clear data
        function clearData() {
            if (confirm('Are you sure you want to clear all data?')) {
                localStorage.removeItem('xtream_playlist');
                localStorage.removeItem('xtream_creds');
                currentChannels = [];
                filteredChannels = [];
                
                document.getElementById('statsContainer').style.display = 'none';
                document.getElementById('controlsCard').style.display = 'none';
                document.getElementById('channelListCard').style.display = 'none';
                
                showToast('All data cleared', 'success');
            }
        }

        // Modal functions
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
            
            // Stop video if closing player
            if (id === 'playerModal') {
                document.getElementById('videoPlayer').innerHTML = '';
            }
        }

        function openSettings() {
            openModal('settingsModal');
        }

        // Toast notification
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Close modals on outside click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal(modal.id);
                }
            });
        });
    </script>
</body>
</html>
